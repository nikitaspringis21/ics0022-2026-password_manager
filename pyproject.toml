[project]
name = "pwmanager"
version = "0.1.0"
description = "A secure, local-first CLI password manager."
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "pyperclip>=1.8",
]

[project.scripts]
pwmanager = "pwmanager.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
